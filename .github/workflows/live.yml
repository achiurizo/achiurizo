name: live

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - config.toml
      - "themes/**"
      - "src/**"
      - "fonts/**"
      - package.json
      - bun.lock

permissions:
  contents: write

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit when the banner changed
        # A manual run on another branch builds and tests, but never commits.
        if: github.ref == 'refs/heads/main'
        run: |
          # The bot identity keeps this commit out of achiurizo's contribution
          # count. A commit authored as achiurizo would raise the count and
          # cause the next commit.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          if git diff --cached --quiet; then
            echo "banner unchanged"
            exit 0
          fi
          # When main moved during this run, this build is stale. Skip the
          # commit: a push that changes the banner inputs starts its own run.
          git fetch --quiet origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main moved during the run, skipping the commit"
            exit 0
          fi
          git commit -m "chore: refresh header"
          git push
