# Theme used when no schedule rule below matches today's date.
# A theme is a file name in themes/, without the extension.
theme = "default"

[segments.left]
text = "since 2008"                      # sits after the GitHub mark

[segments.middle]
text = "drifting thoughts of a model"    # plain text, emoji allowed
link = "https://github.com/achiurizo/dreeft"
title = "dreeft"                         # tooltip, optional

# The right segment shows the live contribution count. It takes an optional
# link, title and suffix (text after the count), never text.

# Dated rules. The first rule whose range holds today's date (UTC) replaces the
# theme, and the right segment's suffix when the rule sets one. from and to are
# MM-DD, both days included. A range may wrap over the new year.
[[schedule]]
from = "10-01"
to = "10-31"
theme = "halloween"
suffix = " \U0001F383"                 # jack-o'-lantern

[[schedule]]
from = "11-01"
to = "12-31"
theme = "christmas"
suffix = " \U0001F384"                 # tree
