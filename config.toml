# Active theme: a file name in themes/, without the extension.
theme = "halloween"

[segments.left]
text = "since 2008"                      # sits after the GitHub mark

[segments.middle]
text = "drifting thoughts of a model"    # plain text, emoji allowed
link = "https://github.com/achiurizo/dreeft"
title = "dreeft"                         # tooltip, optional

# The right segment shows the live contribution count. It takes an optional
# link, title and suffix (text after the count), never text.
[segments.right]
suffix = " \U0001F383"                 # jack-o'-lantern
